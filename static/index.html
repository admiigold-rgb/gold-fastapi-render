<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>கிளை பதிவுத் திரை</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6 border border-slate-200">
    <div class="flex items-center space-x-3 mb-6">
      <div class="bg-amber-500 text-white p-2.5 rounded-xl text-xl font-bold">🪙</div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">பாக்கெட் புதிய பதிவு</h1>
        <p class="text-xs text-slate-500">கிளைப் பணியாளர் உள்ளீட்டுத் திரை</p>
      </div>
    </div>

    <form id="entryForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">கிளை பெயர்</label>
        <input type="text" id="branch_name" required placeholder="எ.கா: Thingalnagar" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">பாக்கெட் எண்</label>
          <input type="text" id="packet_id" required placeholder="PK-101" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">எடை (Grams)</label>
          <input type="number" step="0.01" id="weight_grams" required placeholder="8.50" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">வாடிக்கையாளர் பெயர்</label>
        <input type="text" id="customer_name" required placeholder="பெயர்" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">மொபைல் எண்</label>
          <input type="tel" id="phone" required placeholder="9876543210" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">முன்பணம் (₹)</label>
          <input type="number" id="advance_amount" value="0" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg text-sm transition duration-200 mt-2">
        பதிவு செய்
      </button>
    </form>

    <div id="statusMsg" class="mt-4 text-center text-xs font-medium hidden"></div>
  </div>

  <script>
    const form = document.getElementById('entryForm');
    const msg = document.getElementById('statusMsg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerText = "பதிவாகிறது...";
      msg.classList.add('hidden');

      const payload = {
        branch_name: document.getElementById('branch_name').value,
        packet_id: document.getElementById('packet_id').value,
        weight_grams: parseFloat(document.getElementById('weight_grams').value),
        customer_name: document.getElementById('customer_name').value,
        phone: document.getElementById('phone').value,
        advance_amount: parseFloat(document.getElementById('advance_amount').value) || 0
      };

      try {
        const res = await fetch('/api/packet/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = "✅ " + data.message;
          msg.className = "mt-4 text-center text-xs font-medium text-emerald-600";
          form.reset();
        } else {
          throw new Error(data.detail || "பதிவு தோல்வியடைந்தது");
        }
      } catch (err) {
        msg.textContent = "❌ " + err.message;
        msg.className = "mt-4 text-center text-xs font-medium text-rose-600";
      } finally {
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "பதிவு செய்";
      }
    });
  </script>
</body>
</html>
