<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>வாடிக்கையாளர் வருகை & KYC மேலாண்மை (சோதனை முறை)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6 text-slate-800">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- தலைப்பு & கிளை தேர்வு -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🧪</span>
        <div>
          <h1 class="text-lg font-bold text-slate-800">வாடிக்கையாளர் வரவேற்பு (பாதுகாப்பான சோதனை தளம்)</h1>
          <p class="text-xs text-amber-600 font-medium">அசல் தரவுத்தளம் துண்டிக்கப்பட்டுள்ளது; சோதனை முறையில் இயங்குகிறது</p>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">கிளை ஐடி (Branch ID)</label>
        <input type="number" id="active_branch_id" value="1" class="w-24 px-3 py-1.5 border rounded-lg text-sm font-medium bg-amber-50 text-amber-900 border-amber-200">
      </div>
    </div>

    <!-- தேடல் பகுதி -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <input type="text" id="searchInput" placeholder="சோதனை மொபைல் எண் அல்லது பெயரை உள்ளிடவும் (எ.கா: 9876543210 அல்லது டெஸ்ட்)..." class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
          <span class="absolute left-3 top-3.5 text-slate-400">🔍</span>
        </div>
        <button onclick="handleSearch()" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-xl text-sm font-medium transition">தேடு</button>
        <button onclick="openNewKycModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-3 rounded-xl text-sm font-medium transition">+ புதிய வாடிக்கையாளர் (KYC)</button>
      </div>

      <!-- தேடல் முடிவுகள் -->
      <div id="searchResults" class="mt-4 space-y-2 hidden"></div>
    </div>

    <!-- வாடிக்கையாளர் விபர அட்டை -->
    <div id="customerCard" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hidden space-y-5">
      <div class="flex justify-between items-start border-b pb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800" id="cardName">-</h2>
          <p class="text-xs text-slate-500">மொபைல்: <span id="cardMobile" class="font-medium text-slate-700">-</span> | ID: <span id="cardId">-</span> | முகவரி: <span id="cardAddress">-</span></p>
        </div>
        <span id="cardStatus" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">சோதனை நிலை</span>
      </div>

      <!-- விபர சரிபார்ப்பு கேள்வி -->
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
        <p class="text-sm font-medium text-amber-900">வாடிக்கையாளர் தகவல்களில் ஏதேனும் மாற்றம் உள்ளதா?</p>
        <div class="flex gap-2">
          <button onclick="showUpdateForm()" class="px-4 py-2 bg-white border border-amber-300 rounded-lg text-xs font-semibold text-amber-800 hover:bg-amber-100">ஆம், மாற்றம் உள்ளது</button>
          <button onclick="proceedToTransactions()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-xs font-semibold text-white">மாற்றம் இல்லை (வருகைப் பதிவு செய்)</button>
        </div>
      </div>

      <!-- விபர மாற்றப் படிவம் -->
      <div id="updateFormSection" class="hidden border-t pt-4 space-y-3">
        <h3 class="text-xs font-bold text-slate-700 uppercase">புதிய விபரங்களை உள்ளிடவும்</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="text" id="upd_mobile" placeholder="புதிய மொபைல் எண்" class="border p-2 rounded text-xs">
          <input type="text" id="upd_address" placeholder="புதிய முகவரி" class="border p-2 rounded text-xs">
        </div>
        <button onclick="submitUpdateReq()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded text-xs font-medium">ஒப்புதலுக்கு அனுப்பு</button>
      </div>
    </div>

    <!-- புதிய KYC மாடல் -->
    <div id="kycModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl space-y-4">
        <h3 class="text-base font-bold text-slate-800">புதிய சோதனை வாடிக்கையாளர் KYC</h3>
        <div class="space-y-3">
          <input type="text" id="kyc_name" placeholder="பெயர் *" class="w-full border p-2.5 rounded-lg text-xs">
          <input type="tel" id="kyc_mobile" placeholder="மொபைல் எண் *" class="w-full border p-2.5 rounded-lg text-xs">
          <input type="tel" id="kyc_mobile2" placeholder="இரண்டாவது மொபைல் எண்" class="w-full border p-2.5 rounded-lg text-xs">
          <input type="text" id="kyc_guardian" placeholder="தந்தை / கணவர் பெயர்" class="w-full border p-2.5 rounded-lg text-xs">
          <textarea id="kyc_address" placeholder="முழு முகவரி" class="w-full border p-2.5 rounded-lg text-xs" rows="2"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeNewKycModal()" class="px-4 py-2 border rounded-lg text-xs font-medium">ரத்து</button>
          <button onclick="submitNewKyc()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-medium">சேமி</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let activeCustomer = null;

    async function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      try {
        const res = await fetch(`/api/customer/search?query=${encodeURIComponent(q)}`);
        const result = await res.json();
        const container = document.getElementById('searchResults');
        container.innerHTML = '';

        if (!result.data || result.data.length === 0) {
          container.innerHTML = `<div class="p-3 text-xs text-rose-600 bg-rose-50 rounded-lg border border-rose-200">சோதனைத் தரவு கிடைக்கவில்லை. '+ புதிய வாடிக்கையாளர்' மூலம் உருவாக்கவும்.</div>`;
        } else {
          result.data.forEach(cust => {
            const div = document.createElement('div');
            div.className = "p-3 bg-slate-50 border rounded-xl flex justify-between items-center hover:bg-amber-50 cursor-pointer transition";
            // cust.mobile மூலம் undefined சிக்கல் நீக்கப்பட்டது
            div.innerHTML = `
              <div>
                <div class="font-bold text-sm text-slate-800">${cust.name}</div>
                <div class="text-xs text-slate-500">மொபைல்: ${cust.mobile} | கிளை ஐடி: ${cust.branch_id || '-'}</div>
              </div>
              <button class="text-xs bg-amber-600 text-white px-3 py-1.5 rounded-lg font-medium">தேர்ந்தெடு</button>
            `;
            div.onclick = () => selectCustomer(cust);
            container.appendChild(div);
          });
        }
        container.classList.remove('hidden');
      } catch (err) {
        alert("தேடலில் பிழை: " + err.message);
      }
    }

    function selectCustomer(cust) {
      activeCustomer = cust;
      document.getElementById('cardName').innerText = cust.name;
      document.getElementById('cardMobile').innerText = cust.mobile;
      document.getElementById('cardId').innerText = cust.id;
      document.getElementById('cardAddress').innerText = cust.address || 'முகவரி இல்லை';
      document.getElementById('searchResults').classList.add('hidden');
      document.getElementById('customerCard').classList.remove('hidden');
      document.getElementById('updateFormSection').classList.add('hidden');
    }

    function showUpdateForm() {
      document.getElementById('updateFormSection').classList.remove('hidden');
    }

    async function proceedToTransactions() {
      if (!activeCustomer) return;
      const branchId = parseInt(document.getElementById('active_branch_id').value) || 1;
      
      try {
        const res = await fetch('/api/customer/visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer_id: activeCustomer.id, branch_id: branchId })
        });
        const data = await res.json();
        if (res.ok) {
          alert("✅ " + data.message + " (சோதனை வருகை ID: " + (data.data[0]?.id || '') + ")");
        } else {
          alert("❌ பிழை: " + data.detail);
        }
      } catch (err) {
        alert("பிழை: " + err.message);
      }
    }

    async function submitUpdateReq() {
      if (!activeCustomer) return;
      const branchId = parseInt(document.getElementById('active_branch_id').value) || 1;
      const newMobile = document.getElementById('upd_mobile').value.trim();
      const newAddress = document.getElementById('upd_address').value.trim();

      const payload = {
        customer_id: activeCustomer.id,
        branch_id: branchId,
        requested_changes: { mobile: newMobile, address: newAddress }
      };

      try {
        const res = await fetch('/api/customer/request-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert("✅ " + data.message);
          document.getElementById('updateFormSection').classList.add('hidden');
        } else {
          alert("❌ பிழை: " + data.detail);
        }
      } catch (err) {
        alert("பிழை: " + err.message);
      }
    }

    function openNewKycModal() { document.getElementById('kycModal').classList.remove('hidden'); }
    function closeNewKycModal() { document.getElementById('kycModal').classList.add('hidden'); }

    async function submitNewKyc() {
      const branchId = parseInt(document.getElementById('active_branch_id').value) || 1;
      const payload = {
        name: document.getElementById('kyc_name').value.trim(),
        mobile: document.getElementById('kyc_mobile').value.trim(),
        mobile2: document.getElementById('kyc_mobile2').value.trim() || null,
        guardian_name: document.getElementById('kyc_guardian').value.trim() || null,
        address: document.getElementById('kyc_address').value.trim() || null,
        branch_id: branchId
      };

      if (!payload.name || !payload.mobile) {
        alert("பெயர் மற்றும் மொபைல் எண் கட்டாயம் தேவை.");
        return;
      }

      try {
        const res = await fetch('/api/customer/new-kyc', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert("✅ " + data.message);
          closeNewKycModal();
          document.getElementById('searchInput').value = payload.mobile;
          handleSearch();
        } else {
          alert("❌ பிழை: " + (data.detail || "பதிவு தோல்வியடைந்தது"));
        }
      } catch (err) {
        alert("பிழை: " + err.message);
      }
    }
  </script>
</body>
</html>
